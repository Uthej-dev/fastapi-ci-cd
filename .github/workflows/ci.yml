
name: FastAPI CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r Requirements.txt

      - name: Run tests
        run: |
          pytest -v

      - name: Build Docker image
        run: docker build -t my-fastapi-app .

      - name: Login to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push Docker Image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker tag my-fastapi-app ${{ secrets.DOCKERHUB_USERNAME }}/fastapi-ci-cd:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/fastapi-ci-cd:latest

      - name: Deploy to EC2
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker pull reddy091/fastapi-ci-cd:latest
            docker stop fastapi-container || true
            docker rm fastapi-container || true
            docker run -d --restart unless-stopped -p 8000:8000 --name fastapi-container reddy091/fastapi-ci-cd:latest
